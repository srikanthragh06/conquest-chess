# Frontend — serves the built React app
server {
    listen 80;
    server_name conquestchess.1k5.in www.conquestchess.1k5.in;

    root /var/www/conquest-chess;
    index index.html;

    # SPA fallback for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Backend — proxies REST API and Socket.IO to the Node server
server {
    listen 80;
    server_name api.conquestchess.1k5.in;

    # REST API
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Socket.IO (WebSocket upgrade)
    location /socket/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s; # keep long-lived WebSocket connections open
    }
}
